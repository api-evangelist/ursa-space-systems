aid: ursa-space-systems
name: Ursa Space Systems
description: >-
  Ursa Space Systems is an Ithaca, New York-based geospatial intelligence
  company that turns commercial satellite data — primarily Synthetic Aperture
  Radar (SAR) imagery, combined with electro-optical, RF, AIS, and other
  ground-truth feeds — into decision-ready insight reports. The company
  operates a GeoAI platform branded "From pixels to insights" that fuses
  90+ geospatial data sources and ingests imagery from a global network of
  commercial SAR and EO satellite operators, then applies in-house
  remote-sensing, data science, and GIS expertise to deliver answers about
  what is happening on the ground at specific places and times. Ursa Space
  serves U.S. Government customers — including U.S. Space Force Space
  Systems Command (SSC) under INDOPACOM, AFRICOM, and SOUTHCOM, the
  National Geospatial-Intelligence Agency (NGA) under the Luno A and Luno B
  delivery orders, the Defense Innovation Unit (DIU), and humanitarian-aid
  agencies — as well as commercial enterprise customers in energy,
  commodities, supply chain, maritime, and insurance. Reporting domains
  span security and defense (border monitoring, military activity,
  maritime, dark-vessel and ship-to-ship transfer detection, airstrip
  monitoring), environmental and disaster response (deforestation,
  earthquakes, flooding, wildfires), and infrastructure and industry
  monitoring (construction, mining, oil and gas supply chain, power
  generation, space situational awareness). The platform is currently in
  beta and Ursa Space does not operate a public developer portal, OpenAPI
  reference, SDK, or self-service signup; engagement is sales-led through
  contact@ursaspace.com and tailored to government and enterprise
  contracts.
